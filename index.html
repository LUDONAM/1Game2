<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>В своём темпе — тренажёр печати</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#">⌨ <span>В своём темпе<small>Учимся печатать легко</small></span></a><nav><button data-page="levels">Уровни</button><button data-page="stats">Мои результаты</button><button id="account">Войти</button></nav></header>
<main id="main"></main><footer>Каждая буква — маленький шаг вперёд. Занимайся в своём темпе.</footer>
<dialog id="auth"><form id="authform"><h2 id="authtitle">Вход в аккаунт</h2><p id="authnote"></p><label>Логин<input name="login" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" title="Латинские буквы, цифры и знак подчёркивания"></label><label id="emailwrap" hidden>Почта<input name="email" type="email" autocomplete="email"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><p id="authstatus" role="status"></p><button class="primary" type="submit">Продолжить</button><button type="button" id="switchauth">Создать аккаунт</button><button type="button" id="forgot">Забыли пароль?</button><button type="button" id="closeauth">Закрыть</button></form></dialog>
<script src="config.js"></script><script src="lessons.js"></script><script src="app.js"></script></body></html>
